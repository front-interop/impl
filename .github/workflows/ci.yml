name: front-interop/impl

on:
  push:
    branches: [ 1.x ]
  pull_request:
    branches: [ 1.x ]

jobs:
  build:

    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ubuntu-latest, macos-latest, windows-latest]
        php-versions: ['8.4', '8.5']
    name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}

    steps:
    - uses: actions/checkout@v6

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        coverage: none
    - name: Check PHP Version
      run: php -v

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v5
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install

    - name: Install FrankenPHP
      if: matrix.operating-system == 'ubuntu-latest' && matrix.php-versions == '8.4'
      run: |
        curl -fsSL -o "$RUNNER_TEMP/frankenphp" \
          https://github.com/php/frankenphp/releases/download/v1.12.6/frankenphp-linux-x86_64
        echo "fa74f59593d32f43be9f2803de08cdeed06e9ae5d654a912a086b92b9b290394  $RUNNER_TEMP/frankenphp" | sha256sum --check
        chmod +x "$RUNNER_TEMP/frankenphp"
        echo "FRANKENPHP_BIN=$RUNNER_TEMP/frankenphp" >> "$GITHUB_ENV"
        echo "REQUIRE_FRANKENPHP=1" >> "$GITHUB_ENV"

    - name: QA checks
      run: composer check
